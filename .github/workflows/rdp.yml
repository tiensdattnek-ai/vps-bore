name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      username:
        required: true
        default: admin
      password:
        required: true
        default: Vps@2024#Secure!
      hours:
        required: true
        default: "6"
        type: choice
        options: ["1","2","3","4","5","6"]
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Setup
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -EA 0
          Set-MpPreference -DisableBehaviorMonitoring $true -EA 0
          
          $u = "${{ github.event.inputs.username }}"
          $p = "${{ github.event.inputs.password }}"
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (Get-LocalUser $u -EA 0) { Set-LocalUser $u -Password $sec } else { New-LocalUser $u -Password $sec -PasswordNeverExpires }
          Add-LocalGroupMember Administrators $u -EA 0
          Add-LocalGroupMember "Remote Desktop Users" $u -EA 0
          
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" "fDenyTSConnections" 0
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" "UserAuthentication" 0
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" "SecurityLayer" 0
          
          $path = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $path)) { New-Item $path -Force | Out-Null }
          Set-ItemProperty $path "SelectTransport" 0 -EA 0
          Set-ItemProperty $path "bEnumerateHWBeforeSW" 1 -EA 0
          Set-ItemProperty $path "AVC444ModePreferred" 1 -EA 0
          Set-ItemProperty $path "AVCHardwareEncodePreferred" 1 -EA 0
          Set-ItemProperty $path "fEnableUdpTransport" 1 -EA 0
          Set-ItemProperty $path "MaxFrameRate" 60 -EA 0
          
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes 2>$null
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -EA 0
          
          Restart-Service TermService -Force -EA 0
          
          $sshDir = "$env:USERPROFILE\.ssh"
          if (-not (Test-Path $sshDir)) { New-Item -ItemType Directory $sshDir -Force | Out-Null }
          if (-not (Test-Path "$sshDir\id_rsa")) { ssh-keygen -t rsa -b 2048 -f "$sshDir\id_rsa" -N '""' -q }
          
          Start-Process "ssh" "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 a.pinggy.io" -RedirectStandardOutput "C:\p.log" -RedirectStandardError "C:\p-e.log" -WindowStyle Hidden
          Start-Sleep 10
          
          $addr = $null
          $log = Get-Content "C:\p.log" -EA 0
          if ($log -match "tcp://([a-zA-0-9\.-]+:\d+)") { $addr = $matches[1] }
          
          if (-not $addr) {
            Start-Process "ssh" "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 nokey@localhost.run" -RedirectStandardOutput "C:\l.log" -WindowStyle Hidden
            Start-Sleep 10
            $log = Get-Content "C:\l.log" -EA 0
            if ($log -match "([a-zA-0-9\.-]+\.lhrtunnels\.link:\d+)") { $addr = $matches[1] }
          }
          
          if (-not $addr) { Write-Host "TUNNEL FAILURE"; exit 1 }
          
          Write-Host "=========================================="
          Write-Host "PC NAME: $addr"
          Write-Host "USER: $u"
          Write-Host "PASS: $p"
          Write-Host "=========================================="
          Write-Host "::notice title=RDP::$addr | $u | $p"
          Add-Content $env:GITHUB_ENV "RDP_ADDR=$addr"

      - name: Alive
        shell: powershell
        run: |
          $end = (Get-Date).AddHours([int]"${{ github.event.inputs.hours }}")
          while ((Get-Date) -lt $end) {
            Start-Sleep 60
            if (-not (Get-Process ssh -EA 0)) {
              Start-Process "ssh" "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 a.pinggy.io" -RedirectStandardOutput "C:\p.log" -WindowStyle Hidden
            }
          }
